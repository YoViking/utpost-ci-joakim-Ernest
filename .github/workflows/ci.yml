
name: CI
on:
  pull_request:
    branches: [ main ]  
   
jobs:
  quality:
    name: Kvalitet

    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
      - name: install dependencies
        run: npm ci
      - name: check format
        run: npm run format:check
 
  build:
    name: Bygg
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
      - name: install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: upload dist files
        uses: actions/upload-artifact@v4
        with:
            name: dist-files
            path: client/dist

